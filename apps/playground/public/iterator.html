<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Vitals Playground - iterator</title>
    <base href="/" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="/favicon.ico"
    />
    <link
      rel="stylesheet"
      href="/src/styles.css"
    />

    <script
      type="module"
      src="/src/main.ts"
    ></script>
    <script
      type="module"
      src="/src/form.ts"
    ></script>
  </head>

  <body>
    <h2>Iterator</h2>
    <form id="form">
      <mh-iterator name="year">
        <mh-option value="2025">2025</mh-option>
        <mh-option
          value="2026"
          selected
          >2026</mh-option
        >
        <mh-option value="2027">2027</mh-option>
      </mh-iterator>

      <footer>
        <mh-button type="submit">submit</mh-button>
        <mh-button
          type="reset"
          appearance="outlined"
          >reset</mh-button
        >
      </footer>
    </form>

    <h2>Default and interactive selection</h2>
    <mh-iterator interactive-selection>
      <mh-option value="2025">2025</mh-option>
      <mh-option value="2026">2026</mh-option>
      <mh-option value="2027">2027</mh-option>
    </mh-iterator>

    <h2>Disabled</h2>
    <mh-iterator
      interactive-selection
      disabled
    >
      <mh-option value="2025">2025</mh-option>
      <mh-option
        value="2026"
        selected
        >2026</mh-option
      >
      <mh-option value="2027">2027</mh-option>
    </mh-iterator>
  </body>

  <script>
    document
      .querySelectorAll('mh-iterator')
      .forEach(iterator =>
        iterator.addEventListener('mh-activate-selection', value =>
          console.log('ACTIVATE', value),
        ),
      );
  </script>
</html>
